<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-CEO | Enterprise Engine</title>
    <style>
        :root {
            --bg-main: #f8fafc; --surface: #ffffff; --border: #e2e8f0;
            --text-main: #0f172a; --text-muted: #64748b; --primary: #2563eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 250px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
        .sidebar-brand { font-size: 14px; font-weight: bold; margin-bottom: 30px; letter-spacing: 0.5px; }
        .nav-link { text-decoration: none; color: var(--text-muted); padding: 10px; border-radius: 4px; margin-bottom: 5px; font-size: 13px; font-weight: 500; display: block; }
        .nav-link:hover, .nav-link.active { background: #f1f5f9; color: var(--primary); }
        .sidebar-bottom { margin-top: auto; border-top: 1px solid var(--border); padding-top: 15px; }
        
        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .page-header { margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .page-title { font-size: 20px; font-weight: 600; }
        
        /* Components */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 20px; margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }
        input, textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 15px; font-size: 13px; }
        button { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }
        button:hover { background: #1d4ed8; }
        
        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 11px; }
    </style>
</head>
<body>
    {% if session.get('logged_in') %}
    <nav class="sidebar">
        <div class="sidebar-brand">👔 AUTO-CEO ENGINE</div>
        <a href="/" class="nav-link">⚡ Crisis Simulator</a>
        <a href="/admin" class="nav-link">🛡️ Admin Panel</a>
        
        <div class="sidebar-bottom">
            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 10px;">Logged in as: {{ session.get('role') }}</div>
            <a href="/logout" class="nav-link" style="color: #dc2626;">Log Out</a>
        </div>
    </nav>
    {% endif %}
    
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
