<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-CEO | Executive Engine</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131b2c;
            --bg-input: #1c2538;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #2e3c54;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            display: flex; 
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .app-sidebar { 
            width: 280px; 
            background: var(--bg-card); 
            border-right: 1px solid var(--border); 
            display: flex; 
            flex-direction: column;
            z-index: 10;
        }
        
        .sidebar-header {
            padding: 30px 24px;
            border-bottom: 1px solid var(--border);
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .sidebar-nav { padding: 24px 16px; flex: 1; }
        
        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }
        
        .nav-item:hover, .nav-item.active {
            background: var(--bg-input);
            color: var(--text-main);
            box-shadow: inset 3px 0 0 var(--primary);
        }

        .sidebar-footer { padding: 24px; border-top: 1px solid var(--border); font-size: 13px; }
        
        .app-main { flex: 1; padding: 40px 50px; overflow-y: auto; position: relative; }
        
        /* Subtle background grid for that "engineering" feel */
        .app-main::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
        }

        .content-wrapper { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; }
        
        .page-title { font-size: 28px; font-weight: 700; margin-bottom: 40px; }

        .glass-card {
            background: rgba(19, 27, 44, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .input-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .text-input {
            width: 100%; padding: 14px; background: var(--bg-input); border: 1px solid var(--border); 
            border-radius: 8px; font-size: 14px; color: var(--text-main); margin-bottom: 24px;
            transition: all 0.3s ease; outline: none; font-family: inherit;
        }
        
        .text-input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px var(--primary-glow); 
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #2563eb); 
            color: white; border: none; padding: 16px; border-radius: 8px; 
            font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; 
            transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        
        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); 
        }
    </style>
</head>
<body>
    {% if session.get('logged_in') %}
    <aside class="app-sidebar">
        <div class="sidebar-header">⚡ AUTO-CEO ENGINE</div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item">Live Simulator</a>
            
            <!-- Dynamic Role-Based Routing for the Sidebar -->
            {% if session.get('role') == 'admin' %}
                <a href="/admin" class="nav-item">🛡️ Global System Logs</a>
            {% else %}
                <a href="/history" class="nav-item">📊 My Run History</a>
            {% endif %}
        </nav>
        <div class="sidebar-footer">
            <div style="color: var(--text-muted); margin-bottom: 10px;">User: {{ session.get('username') }} ({{ session.get('role') }})</div>
            <a href="/logout" style="color: var(--danger); font-weight: 600; text-decoration: none;">End Session</a>
        </div>
    </aside>
    {% endif %}
    
    <main class="app-main">
        <div class="content-wrapper">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
